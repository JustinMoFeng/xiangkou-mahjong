name = "xiangkou-mahjong"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Keep the *.workers.dev URL enabled alongside the custom domain below.
workers_dev = true

# Custom domain. 9423.net is on Cloudflare DNS, so wrangler auto-creates the DNS
# record + cert and binds it to this Worker on deploy. This is separate from the
# existing majong.9423.net (EdgeOne), which is left untouched.
routes = [
  { pattern = "majong-cloud.9423.net", custom_domain = true }
]

# Serve the built SPA. `npm run build` outputs to dist/.
# not_found_handling = single-page-app gives history-mode routing fallback.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# SQLite-backed Durable Objects are available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
